# Inherits from ../series.yaml: SERVER_IP, SERVER_IPV6, USERNAME, SSH_PORT, DEPLOY_USER, DOMAIN, WEB_ROOT, ADMIN_EMAIL, LOCAL_DIR.
# No page variables: two choices only.

title:
  en: Launch checklist
  fr: Checklist de lancement
summary:
  en: >-
    Before you announce the site: robots.txt and sitemap.xml generated by Next.js, the heaviest
    files trimmed, and everything the previous pages set up verified from the outside — redirects,
    404, certificate, headers, IPv6, HTTP/3, performance — with one script that prints PASS or FAIL.
  fr: >-
    Avant d'annoncer le site : robots.txt et sitemap.xml générés par Next.js, les fichiers les plus
    lourds allégés, et tout ce que les pages précédentes ont mis en place vérifié depuis l'extérieur
    — redirections, 404, certificat, en-têtes, IPv6, HTTP/3, performance — avec un script qui
    affiche PASS ou FAIL.
difficulty: beginner
tags: [launch, seo, robots, sitemap, tls, hsts, performance, nextjs]
authors: [thudal]
created: 2026-09-26
minutes: 30
validated: Next.js 16 · Caddy 2.x · Sept 2026
status: draft             # not yet run end to end by its author

choices:
  - key: INDEXING
    type: boolean
    label: { en: Let search engines index the site, fr: Laisser les moteurs de recherche indexer le site }
    hint:
      en: Off, robots.txt asks every crawler to stay away. Useful while you test before launch day; switch it on and redeploy when you announce.
      fr: Désactivé, robots.txt demande à tous les robots de rester à l'écart. Utile tant que tu testes avant le jour du lancement ; active-le et redéploie quand tu annonces.
    default: true
  - key: HSTS_PRELOAD
    type: boolean
    label: { en: Submit the domain to the HSTS preload list, fr: Inscrire le domaine sur la liste de préchargement HSTS }
    hint:
      en: Browsers then refuse plain HTTP for the domain and every subdomain, even on a first visit. Hard to undo; leave it off unless you are sure.
      fr: Les navigateurs refusent alors le HTTP en clair pour le domaine et tous ses sous-domaines, même à la première visite. Difficile à défaire ; laisse désactivé si tu n'es pas sûr.
    default: false
