# Contract for this tutorial: language-independent.
# Prose lives in page-en.mdx / page-fr.mdx and may only use what is declared here.

title:
  en: Install NetBox from scratch
  fr: Installer NetBox de zéro
summary:
  en: >-
    From a fresh Linux server to a NetBox instance behind HTTPS, ready for users.
    PostgreSQL, Redis, NetBox itself, gunicorn, then the web server you choose.
  fr: >-
    D'un serveur Linux vierge à une instance NetBox derrière HTTPS, prête pour les utilisateurs.
    PostgreSQL, Redis, NetBox lui-même, gunicorn, puis le serveur web de ton choix.
difficulty: intermediate
tags: [netbox, postgresql, redis, gunicorn, nginx, apache]
authors: [thudal]
created: 2026-09-24
minutes: 45
validated: NetBox 4.4 · Ubuntu 24.04
status: draft             # not yet run end to end by its author

groups:
  - id: db
    label: { en: Database, fr: Base de données }
vars:
  - key: NETBOX_REF
    kind: text
    group: host
    default: master
    label: { en: NetBox version, fr: Version de NetBox }
    hint:
      en: Which version of the code to fetch from GitHub. "master" is always the latest stable release; a tag such as v4.4.0 pins one precise version.
      fr: Quelle version du code récupérer sur GitHub. « master » est toujours la dernière version stable ; un tag comme v4.4.0 fige une version précise.
    impact:
      en: Pinning a tag makes the install reproducible and keeps upgrades a deliberate act. With master, a re-run of the clone step may fetch a newer release than the one you tested.
      fr: Figer un tag rend l'installation reproductible et garde les mises à jour volontaires. Avec master, relancer l'étape de clonage peut récupérer une version plus récente que celle testée.
  - key: ADMIN_EMAIL
    kind: email
    group: host
    default: admin@example.com
    label: { en: Admin email, fr: Email administrateur }
    hint:
      en: The address responsible for this server. Let's Encrypt writes to it before a certificate expires.
      fr: L'adresse responsable de ce serveur. Let's Encrypt lui écrit avant l'expiration d'un certificat.
    impact:
      en: Only used when the certificate comes from Let's Encrypt. It is not published and NetBox itself does not send mail with it.
      fr: Utilisé seulement si le certificat vient de Let's Encrypt. Il n'est pas publié et NetBox n'envoie pas de mail avec.
  - key: DB_PASSWORD
    kind: secret
    group: db
    default: ""
    label: { en: PostgreSQL password, fr: Mot de passe PostgreSQL }
    hint:
      en: The password of the "netbox" database account that NetBox uses to talk to PostgreSQL. Generate a long random one; nobody types it by hand.
      fr: Le mot de passe du compte de base « netbox » que NetBox utilise pour parler à PostgreSQL. Génère-en un long et aléatoire ; personne ne le tape à la main.
    impact:
      en: Set once when the database role is created, then copied into configuration.py. If the two differ, the first migration fails with "password authentication failed for user netbox". It never leaves this server.
      fr: Défini une fois à la création du rôle de base, puis recopié dans configuration.py. Si les deux diffèrent, la première migration échoue avec « password authentication failed for user netbox ». Il ne quitte jamais ce serveur.

choices:
  - key: TLS
    type: select
    label: { en: Certificate, fr: Certificat }
    default: selfsigned
    options:
      - { value: selfsigned, label: { en: Self-signed, fr: Auto-signé } }
      - { value: letsencrypt, label: { en: Let's Encrypt, fr: Let's Encrypt } }
